# =============================================================================
# SurveyPulse — Nginx конфігурація для Docker-контейнера за Cloudflare Proxy
# =============================================================================
# Розміщення всередині контейнера: /etc/nginx/conf.d/default.conf
# Cloudflare термінує HTTPS зовні → Nginx слухає лише :80 всередині Docker
# =============================================================================

# ── Cloudflare Real IP ────────────────────────────────────────────────────────
# Nginx бачить IP Cloudflare-edge-ноди, а не реального клієнта.
# Ці директиви замінюють $remote_addr на справжній IP із CF-Connecting-IP.
# Актуальні діапазони: https://www.cloudflare.com/ips/
# Оновлювати при зміні у Cloudflare.
# ──────────────────────────────────────────────────────────────────────────────
geo $cloudflare_ip {
    default         0;

    # IPv4
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22   1;
    104.16.0.0/13   1;
    104.24.0.0/14   1;
    108.162.192.0/18 1;
    131.0.72.0/22   1;
    141.101.64.0/18 1;
    162.158.0.0/15  1;
    172.64.0.0/13   1;
    173.245.48.0/20 1;
    188.114.96.0/20 1;
    190.93.240.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;

    # IPv6
    2400:cb00::/32  1;
    2606:4700::/32  1;
    2803:f800::/32  1;
    2405:b500::/32  1;
    2405:8100::/32  1;
    2a06:98c0::/29  1;
    2c0f:f248::/32  1;
}

# ── Налаштування real_ip ──────────────────────────────────────────────────────
# Замінює $remote_addr справжнім IP клієнта від Cloudflare
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Cloudflare передає реальний IP у цьому заголовку
real_ip_header CF-Connecting-IP;

# ── Основний сервер ───────────────────────────────────────────────────────────
server {
    # Nginx всередині Docker слухає :80.
    # Cloudflare Proxy приймає HTTPS і форвардить HTTP сюди.
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Security headers ──────────────────────────────────────────────────────
    # HSTS не потрібен тут — Cloudflare сам додає його назовні
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Upload ────────────────────────────────────────────────────────────────
    client_max_body_size 10M;

    # ── WebSocket proxy: /ws → backend (Docker service name) ─────────────────
    location /ws {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;

        # Обов'язково для WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Реальний IP клієнта (вже замінений set_real_ip_from вище)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Повідомити backend що з'єднання прийшло через HTTPS (Cloudflare)
        proxy_set_header X-Forwarded-Proto https;
        # Оригінальний заголовок від Cloudflare
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header CF-RAY            $http_cf_ray;

        # Тривале з'єднання для WS
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }

    # ── REST API proxy: /api → backend (Docker service name) ─────────────────
    location /api {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;

        # Keep-alive upstream (без upgrade — це HTTP, не WS)
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Оригінальні Cloudflare заголовки для backend
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header CF-RAY            $http_cf_ray;
        proxy_set_header CF-IPCountry      $http_cf_ipcountry;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Не буферизувати — важливо для SSE і великих відповідей
        proxy_buffering off;
        proxy_intercept_errors off;
    }

    # ── Frontend SPA (статика з контейнера) ───────────────────────────────────
    # Шлях відповідає Dockerfile: COPY --from=builder /app/dist /usr/share/nginx/html
    location / {
        root  /usr/share/nginx/html;
        index index.html;

        # SPA routing — всі невідомі шляхи → index.html
        try_files $uri $uri/ /index.html;

        # Статика кешується на 1 рік (Cloudflare теж кешуватиме)
        location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # HTML ніколи не кешувати (SPA shell завжди свіжий)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }
    }

    # ── Логи ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
