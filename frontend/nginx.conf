server {
    listen 80;
    server_name _;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Максимальний розмір тіла запиту
    client_max_body_size 10M;

    # ── WebSocket: /ws → backend ──────────────────────────────────────────
    location /ws {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;

        # Обов'язкові заголовки для WebSocket upgrade
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Тримаємо з'єднання живим (довгі WS-сесії)
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket: /api/chat/ws → backend ──────────────────────────────────
    location /api/chat/ws {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }

    # ── REST API: /api → backend ──────────────────────────────────────────
    location /api {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;

        # Keep-alive upstream (без "upgrade" щоб не плутати з WS)
        proxy_set_header   Connection        "";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Не буферизувати відповіді (важливо для streaming / SSE)
        proxy_buffering off;

        # Передавати помилки від upstream як є (не замінювати на 502/504 nginx)
        proxy_intercept_errors off;
    }

    # ── Frontend SPA ──────────────────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;

        # SPA routing — невідомі шляхи → index.html
        try_files $uri $uri/ /index.html;

        # Кеш статики на 1 рік
        location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # HTML ніколи не кешувати
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }
    }

    # ── Логи ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
